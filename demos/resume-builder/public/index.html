<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Resume PDF Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Advanced Resume PDF Builder</h1>
        <p>Paste or edit your LaTeX resume and export a polished PDF instantly.</p>
      </header>

      <section class="editor-card">
        <div class="toolbar">
          <button id="load-default" type="button">Load Sample Template</button>
          <button id="download-pdf" type="button" class="primary">Generate PDF</button>
        </div>
        <textarea id="latex-input" spellcheck="false" aria-label="LaTeX input"></textarea>
        <p id="status" class="status">Ready.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
